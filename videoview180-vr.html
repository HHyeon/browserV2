<html>
    <head>
        <meta charset="utf-8">
        <title>VR Player</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                background: rgb(20, 20, 20);
                color: #fff;
                font-family: sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                overflow: hidden;
                user-select: none;
                -webkit-user-select: none;
            }
            #vr-btn {
                padding: 20px 48px;
                font-size: 24px;
                font-weight: bold;
                color: #fff;
                background: rgba(100, 180, 255, 0.85);
                border: none;
                border-radius: 12px;
                cursor: pointer;
                transition: background 0.2s;
                -webkit-tap-highlight-color: transparent;
            }
            #vr-btn:active { background: rgba(60, 140, 220, 0.95); }
            #vr-btn.disabled {
                background: rgba(80, 80, 80, 0.5);
                cursor: default;
                pointer-events: none;
            }
            #msg {
                margin-top: 16px;
                font-size: 14px;
                color: rgba(255,255,255,0.5);
                min-height: 20px;
            }
            #filename {
                margin-top: 8px;
                font-size: 13px;
                color: rgba(255,255,255,0.35);
                max-width: 80vw;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            #vr-container { display: none; }
        </style>
    </head>
    <body oncontextmenu="return false">

        <div id="vr-container">
            <video id="vr180" title="180 Video" crossOrigin="anonymous" playsinline muted style="object-fit: contain;" buffered></video>
        </div>

        <button id="vr-btn">VR 시작</button>
        <div id="msg"></div>
        <div id="filename"></div>

        <script>
            const urlParams = new URL(window.location.href).searchParams;
            let parampath = urlParams.get('p');
            document.title = parampath ? parampath.substring(parampath.lastIndexOf('/') + 1) : 'VR Player';
            document.getElementById('filename').textContent = document.title;
            document.getElementById('vr180').src = parampath;
        </script>
        <script type="module" src="vr180player/vr180-player.js"></script>
        <script>
            document.getElementById('vr-btn').addEventListener('click', () => {
                if (typeof window.enterNativeVR === 'function') {
                    document.getElementById('vr-btn'); //.classList.add('disabled');
                    document.getElementById('msg').textContent = 'VR 세션 시작 중...';
                    window.enterNativeVR();
                } else {
                    document.getElementById('msg').textContent = '플레이어 로딩 중, 잠시 후 다시 시도하세요';
                }
            });
        </script>

    </body>
</html>
