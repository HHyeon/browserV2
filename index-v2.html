<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title">BrowserV2</title>
    <style>
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #252525;
            --bg-card: #2a2a2a;
            --text-primary: #e8e8e8;
            --text-secondary: #999;
            --accent: #007bff;
            --accent-hover: #0056b3;
            --border: #3a3a3a;
            --shadow: rgba(0,0,0,0.4);
            --card-radius: 8px;
            --card-min-w: 280px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        body.menu-open { overflow: hidden; }

        /* ===== Header ===== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            user-select: none;
        }

        .header-logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
            cursor: default;
        }

        .header-search {
            flex: 1;
            max-width: 360px;
            position: relative;
        }

        .header-search input {
            width: 100%;
            padding: 8px 14px 8px 34px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .header-search input:focus {
            border-color: var(--accent);
        }

        .header-search input::placeholder {
            color: var(--text-secondary);
        }

        .header-search::before {
            content: '🔍';
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            pointer-events: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }

        .hbtn {
            padding: 6px 12px;
            border-radius: 5px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .hbtn:hover {
            background: var(--bg-card);
            color: var(--text-primary);
            border-color: #555;
        }

        .hbtn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .hbtn-icon {
            padding: 6px 8px;
            font-size: 14px;
        }

        .header-sep {
            width: 1px;
            height: 24px;
            background: var(--border);
        }

        /* ===== Grid ===== */
        .grid-wrap {
            padding: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--card-min-w), 1fr));
            gap: 10px;
        }

        /* ===== Loading Overlay ===== */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-primary, #1a1a1a);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            transition: opacity 0.3s ease;
        }
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: var(--accent, #64b4ff);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }
        .loading-progress {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
        }

        /* ===== Card ===== */
        .card {
            position: relative;
            border-radius: var(--card-radius);
            overflow: hidden;
            background: var(--bg-card);
            border: 2px solid transparent;
            aspect-ratio: 4/3;
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.2s;
        }

        .card:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 16px var(--shadow);
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .card a {
            position: absolute;
            inset: 0;
            z-index: 2;
            text-decoration: none;
            color: inherit;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            -webkit-user-drag: none;
            user-select: none;
        }

        .card img.vr-half {
            width: 200% !important;
            object-position: center;
        }

        .card-grid4 {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2px;
            background: #111;
            overflow: hidden;
        }
        .card-grid4 > * {
            position: static;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }
        .card-grid4 img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        .grid4-empty {
            background: #222;
        }

        .card-split2 {
            position: absolute;
            inset: 0;
            display: flex;
            gap: 2px;
            background: #111;
            overflow: hidden;
        }
        .card-split2 > img {
            flex: 1;
            min-width: 0;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .card video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Card Title Overlay */
        .card-title-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px 10px;
            z-index: 3;
            background: linear-gradient(transparent, rgba(0,0,0,0.75));
        }

        .card-title-layer h3 {
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            word-break: break-all;
            line-height: 1.3;
        }

        /* Card Badges (favorite star sits adjacent-left of badge column) */
        .card-badges {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 4px;
            z-index: 4;
        }

        .card-badges-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cbadge {
            position: relative;
            display: inline-flex;
            align-items: center;
            padding: 6px 20px;
            font-size: 22px;
            font-weight: 700;
            border-radius: 8px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .cbadge a {
            position: absolute;
            inset: 0;
            z-index: 5;
            text-decoration: none;
            color: inherit;
        }

        .cbadge-playvid { background: rgba(0, 123, 255, 0.75); }
        .cbadge-playvid180 { background: rgba(138, 43, 226, 0.75); }

        /* Card Rating */
        .card-rating {
            position: absolute;
            top: 6px;
            left: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            z-index: 4;
        }

        .cr-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 18px;
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            background: rgba(255, 155, 0, 0.55);
            border-radius: 3px;
            cursor: pointer;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
            transition: background 0.15s;
        }

        .cr-btn:hover {
            background: rgba(255, 155, 0, 0.85);
        }

        .cr-val {
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
            line-height: 1;
        }

        /* Favorite toggle (video cards only, adjacent-left of badges) */
        .card-fav {
            position: relative;
            flex-shrink: 0;
            margin-top: 6px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.35);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
            cursor: pointer;
            z-index: 12;
            user-select: none;
            transition: color 0.15s, transform 0.1s;
        }

        .card-fav:hover {
            color: rgba(255, 255, 255, 0.85);
            transform: scale(1.15);
        }

        .card-fav.on {
            color: #ffc531;
            text-shadow: 0 0 6px rgba(255,197,49,0.7), 1px 1px 2px rgba(0,0,0,0.7);
        }

        /* Video progress bar */
        .vid-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(0,0,0,0.5);
            z-index: 5;
            pointer-events: none;
        }

        .vid-progress-bar {
            height: 100%;
            width: 0%;
            background: rgba(0, 200, 255, 0.8);
            transition: width 0.3s ease;
        }

        .thumbnail-error-icon {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 22px;
            height: 22px;
            background: rgba(255, 0, 0, 0.8);
            border-radius: 50%;
            color: #fff;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .empty-state h2 {
            font-size: 20px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            z-index: 2000;
            white-space: nowrap;
        }

        .toast.show { opacity: 1; }

        /* ===== Shortcuts Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show { display: flex; }

        .modal-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 24px;
            max-width: 420px;
            width: 90%;
        }

        .modal-box h3 {
            font-size: 16px;
            margin-bottom: 14px;
        }

        .sc-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .sc-key {
            background: var(--bg-card);
            padding: 2px 8px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 12px;
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">불러오는 중...</div>
        <div class="loading-progress" id="loadingProgress"></div>
    </div>

    <div class="toast" id="action-toast"></div>

    <canvas hidden></canvas>

    <header class="header">
        <span class="header-logo">BrowserV2</span>
        <div class="header-search">
            <input type="text" id="headerSearchInput" placeholder="검색 (Enter) / Backspace: 상위">
        </div>
        <div class="header-actions">
            <button class="hbtn active" data-sort="1" title="최신순">최신</button>
            <button class="hbtn" data-sort="2" title="이름순">이름</button>
            <button class="hbtn" data-sort="3" title="데일리 셔플">셔플</button>
            <button class="hbtn" data-sort="4" title="랜덤">랜덤</button>
            <div class="header-sep"></div>
            <button class="hbtn" id="btnRatingToggle" title="별점 정렬 (0)">별점</button>
            <button class="hbtn" id="btnSingleFrame" title="싱글프레임 (S)">1F</button>
            <div class="header-sep"></div>
            <button class="hbtn hbtn-icon" id="btnSizeDown" title="카드 축소 (-)">−</button>
            <span id="sizeLabel" style="font-size:12px;color:var(--text-secondary);min-width:20px;text-align:center;user-select:none;">M</span>
            <button class="hbtn hbtn-icon" id="btnSizeUp" title="카드 확대 (+)">+</button>
            <div class="header-sep"></div>
            <button class="hbtn hbtn-icon" id="btnBookmarks" title="북마크 (B)">★</button>
            <button class="hbtn hbtn-icon" id="btnFavorites" title="즐겨찾기 (F)">♥</button>
            <button class="hbtn hbtn-icon" id="btnHelp" title="도움말 (?)">?</button>
        </div>
    </header>

    <div class="grid-wrap">
        <div class="grid" id="grid"></div>
    </div>

    <div id="emptyState" class="empty-state" style="display:none;">
        <h2 id="emptyTitle"></h2>
    </div>

    <div class="modal-overlay" id="helpModal">
        <div class="modal-box">
            <h3>키보드 단축키</h3>
            <div class="sc-row"><span>검색</span><span class="sc-key">Enter</span></div>
            <div class="sc-row"><span>검색 취소</span><span class="sc-key">Escape</span></div>
            <div class="sc-row"><span>상위 디렉토리</span><span class="sc-key">Backspace</span></div>
            <div class="sc-row"><span>별점 정렬 토글</span><span class="sc-key">0</span></div>
            <div class="sc-row"><span>싱글프레임 토글</span><span class="sc-key">S</span></div>
            <div class="sc-row"><span>카드 확대</span><span class="sc-key">+</span></div>
            <div class="sc-row"><span>카드 축소</span><span class="sc-key">−</span></div>
            <div class="sc-row"><span>강제 새로고침</span><span class="sc-key">\</span></div>
            <div class="sc-row"><span>북마크 열기</span><span class="sc-key">B</span></div>
                <div class="sc-row"><span>즐겨찾기 세션 (새 탭, 현재 폴더 하위)</span><span class="sc-key">F</span></div>
            <div class="sc-row"><span>이 도움말</span><span class="sc-key">?</span></div>
            <div style="text-align:right;margin-top:12px;">
                <button class="hbtn" onclick="document.getElementById('helpModal').classList.remove('show')">닫기</button>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // ============================================================
        // CONFIG
        // ============================================================
        let FFMPEG_SERVER_URL = '';
        function getFfmpegUrl() { return FFMPEG_SERVER_URL || `http://${location.hostname}:3002`; }
        fetch('ffmpeg_config.json', { cache: 'no-store' })
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(c => { const v = c && c.ffmpeg_server_url; if (typeof v === 'string' && v.trim()) FFMPEG_SERVER_URL = v.trim(); })
            .catch(() => {});

        let webxrSupported = false;
        if (navigator.xr) {
            navigator.xr.isSessionSupported('immersive-vr').then(s => { webxrSupported = s; }).catch(() => {});
        }
        function getVRViewerPath() { return webxrSupported ? 'videoview180-vr.html' : 'videoview180.html'; }

        // ============================================================
        // URL PARAMS
        // ============================================================
        const BASE_DIR = document.location.origin + document.location.pathname.replace(/[^/]*$/, '');
        const urlParams = new URL(window.location.href).searchParams;
        let paramfind = urlParams.get('f');
        let parampath = urlParams.get('p');
        let favMode = urlParams.get('fav') === '1';
        if (parampath != null) document.title = parampath.substring(parampath.lastIndexOf('/') + 1);
        let parampathgiven = true;
        if (parampath == '.' || parampath == null) { parampathgiven = false; }
        else {
            if (parampath[parampath.length - 1] == '/') parampath = parampath.substring(0, parampath.length - 1);
            parampath = encodeURI(parampath);
        }
        if (parampath == null) parampath = '.';

        // ============================================================
        // PATH PREFS (localStorage)
        // ============================================================
        function getPathPrefs() { try { return JSON.parse(localStorage.getItem('listordertype_paths') || '{}'); } catch(e) { return {}; } }
        function getPathPref() { return getPathPrefs()[parampath] || {}; }
        function setPathPref(patch) {
            const p = getPathPrefs();
            p[parampath] = { ...(p[parampath] || {}), ...patch };
            localStorage.setItem('listordertype_paths', JSON.stringify(p));
        }

        // ============================================================
        // UTIL
        // ============================================================
        function escapeHtml(s) {
            return String(s ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
        }
        function encodeUriSafe(s) { return encodeURI(String(s ?? '')); }
        function joinPath(base, name) {
            if (base === '.' || base === '') return name;
            if (base.endsWith('/')) base = base.slice(0, -1);
            return base + '/' + name;
        }
        function splitPath(full) {
            const i = full.lastIndexOf('/');
            return i < 0 ? { base: '.', fname: full } : { base: full.substring(0, i), fname: full.substring(i + 1) };
        }
        function isImageExt(n) {
            const a = n.toLowerCase();
            return a.endsWith('jpeg') || a.endsWith('jpg') || a.endsWith('png') || a.endsWith('webp') || a.endsWith('gif');
        }

        // ============================================================
        // API
        // ============================================================
        async function dirseek(param) {
            try {
                const r = await fetch(`dirseek.php?x=${param}`, { cache: 'no-store' });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return await r.json();
            } catch (e) { console.error('dirseek failed', e); return { ret: false, data: [] }; }
        }

        async function getRating(folderName) {
            try {
                const r = await fetch(`rate.php?name=${encodeURIComponent(folderName)}`);
                const j = await r.json();
                return j.ret ? j.value : 0;
            } catch (e) { return 0; }
        }

        async function setRating(folderName, value) {
            try {
                const r = await fetch('rate.php', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: folderName, value })
                });
                return (await r.json()).ret;
            } catch (e) { return false; }
        }

        // ============================================================
        // BOOKMARKS
        // ============================================================
        let allBookmarks = {}, allVrBookmarks = {}, bookmarksLoaded = false;
        async function loadAllBookmarks() {
            if (bookmarksLoaded) return;
            try {
                const [n, v] = await Promise.all([
                    fetch('bookmark.php?all=1', { cache: 'no-store' }),
                    fetch('bookmark.php?all=1&mode=vr', { cache: 'no-store' })
                ]);
                if (n.ok) { const j = await n.json(); allBookmarks = j.data || {}; }
                if (v.ok) { const j = await v.json(); allVrBookmarks = j.data || {}; }
                bookmarksLoaded = true;
            } catch (e) { console.error('bookmark load failed', e); }
        }
        function getBookmarksForVideo(path) {
            const all = [...(allBookmarks[path] || []), ...(allVrBookmarks[path] || [])];
            return all.length > 0 ? all : null;
        }
        function pickBookmarkTime(path, dur) {
            const bms = getBookmarksForVideo(path);
            if (bms && bms.length > 0) {
                const b = bms[Math.floor(Math.random() * bms.length)];
                return Math.min(b.time, dur || b.time);
            }
            return null;
        }

        // ============================================================
        // FAVORITES (비디오/디렉터리 자체 즐겨찾기 — 시점북마크와 무관)
        // ============================================================
        // encodeURI/디코드 혼재 키를 동일 경로로 비교 (favorite.php canon과 동일 규칙)
        const favNorm = p => { try { return decodeURI(p); } catch (e) { return p; } };
        let favoritesSet = new Set();
        async function loadFavorites() {
            try {
                const res = await fetch('favorite.php?all=1', { cache: 'no-store' });
                const json = await res.json();
                favoritesSet = new Set(Object.keys(json.data || {}).map(favNorm));
            } catch (e) {
                console.error('favorites load failed', e);
                favoritesSet = new Set();
            }
        }
        async function toggleFavorite(fkey) {
            const fkeyNorm = favNorm(fkey);
            const wasOn = favoritesSet.has(fkeyNorm);
            try {
                const entry = makeitemStore[fkey];
                const body = { action: wasOn ? 'remove' : 'add', path: fkey };
                if (entry) body.dir = !!entry.itemEnterable;
                const res = await fetch('favorite.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const json = await res.json();
                if (!json.ret) { showToast('즐겨찾기 저장 실패'); return; }
                if (json.favorited) favoritesSet.add(fkeyNorm); else favoritesSet.delete(fkeyNorm);
                document.querySelectorAll('.card-fav').forEach(el => {
                    if (el.dataset.favKey === fkey) el.classList.toggle('on', json.favorited);
                });

        // ============================================================
        // VR DETECTION
        // ============================================================
        let vid180Cache = {};
        function isVRByFilename(fname) {
            const n = fname.toLowerCase();
            if (n.includes('vr') || n.includes('180')) return true;
            if (n.includes('panorama') || n.includes('pano')) return true;
            if (n.endsWith('.360') || n.endsWith('.insv') || n.endsWith('.insp') || n.endsWith('.thumb')) return true;
            if (/(^|[^a-z0-9])360([^a-z0-9]|$)/.test(n)) return true;
            return false;
        }
        async function isVRVideo(vidpath, fname) {
            if (vid180Cache[vidpath] !== undefined) return vid180Cache[vidpath];
            try {
                const r = await fetch(`vrprobe.php?x[]=${vidpath}`, { cache: 'no-store' });
                if (r.ok) {
                    const arr = await r.json();
                    const item = Array.isArray(arr) ? arr[0] : null;
                    if (item && typeof item.isVR === 'boolean') { vid180Cache[vidpath] = item.isVR; return item.isVR; }
                }
            } catch (e) { console.error('vrprobe failed', e); }
            vid180Cache[vidpath] = isVRByFilename(fname);
            return vid180Cache[vidpath];
        }

        // ============================================================

        let dirlist = [];
        let dirFlagMap = {};
        let makeitemStore = {};

        // ============================================================
        // VIRTUAL SCROLL

        const BUFFER_ROWS = 3;
        const RENDER_BATCH = 20;
        let lastScrollRow = -1;

        const cardObserver = new IntersectionObserver(entries => {

        // ============================================================
        // THUMBNAIL MANAGER
        // ============================================================
        let isPageFocused = !document.hidden;
        let activeVideoLoads = 0;
        const MAX_CONCURRENT_LOADS = 8;
        let videoLoadQueue = [];

        const thumbMgr = {
            active: new Map(),
            errors: new Map(),

            setupProgress(card, fkey) {
                const bar = card.querySelector('.vid-progress-bar');
                if (bar && storeOf(fkey)) storeOf(fkey).progressBar = bar;
            },

            showError(fkey, el) {
                if (this.errors.has(fkey) || !el || !el.parentElement) return;
                const d = document.createElement('div');
                d.className = 'thumbnail-error-icon';
                d.textContent = '⚠';
                el.parentElement.appendChild(d);
                this.errors.set(fkey, d);
            },

            hideError(fkey) {
                const e = this.errors.get(fkey);
                if (e) { e.remove(); this.errors.delete(fkey); }
            },

            start(fkey, el) {
                if (this.active.has(fkey) || !isPageFocused || document.hidden || !el.isConnected) return;
                const data = storeOf(fkey);
                if (singleFrameMode && data && data.hasThumb && !data.needVideoLoad) return;
                this.active.set(fkey, true);
                this.tick(fkey, el);
            },

            stop(fkey) {
                this.active.delete(fkey);
                this.hideError(fkey);
            },

            tick(fkey, el) {
                if (!isPageFocused || document.hidden || !this.active.has(fkey) || !el.isConnected) {
                    this.stop(fkey); return;
                }
                const data = storeOf(fkey);
                if (!data || !data.videoPath) { this.stop(fkey); return; }

                const dur = data.videoDuration || 30;
                let seekTime;
                const bm = pickBookmarkTime(data.videoPath, data.videoDurationKnown ? dur : undefined);
                if (bm) { seekTime = bm; data.currentSeekTime = bm; }
                else {
                    data.currentSeekTime = ((data.currentSeekTime || 0) + 10) % dur;
                    if (data.currentSeekTime < 30) data.currentSeekTime = 30;
                    seekTime = data.currentSeekTime;
                }

                if (data.progressBar) data.progressBar.style.width = `${Math.min(100, (seekTime / dur) * 100)}%`;

                const cacheUrl = `bookmark_thumb.php?path=${encodeURIComponent(data.videoPath)}&time=${seekTime}`;
                const curEl = el, curFkey = fkey, curData = data;

                console.log(`[thumb] ${fkey} 캐시 시도 seek=${seekTime}`);
                fetch(cacheUrl, { method: 'GET', cache: 'no-store' })
                    .then(r => { if (r.ok) return r.blob(); throw new Error('miss'); })
                    .then(blob => {
                        if (!curEl.isConnected) return;
                        curEl.src = URL.createObjectURL(blob);
                        console.log(`[thumb] ${curFkey} 캐시 이미지 로드 완료`);
                        this.hideError(curFkey);
                        if (!singleFrameMode && isPageFocused && this.active.has(curFkey)) this.tick(curFkey, curEl);
                    })
                    .catch(() => {
                        console.log(`[thumb] ${curFkey} 캐시 미스 - FFmpeg 디코딩 시작 seek=${seekTime}`);
                        fetch(`${getFfmpegUrl()}/decode`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ videoPath: curData.videoPath, seekTime })
                        })
                        .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
                        .then(res => {
                            if (!res.success || !res.base64 || res.base64.length <= 100) return 'skip';
                            if (!curEl.isConnected) return 'skip';
                            curEl.src = res.base64;
                            curData.hasThumb = true;
                            console.log(`[thumb] ${curFkey} FFmpeg 디코딩 완료`);
                            this.hideError(curFkey);

                            const bms = getBookmarksForVideo(curData.videoPath);
                            if (bms) {
                                return fetch('bookmark_thumb.php?cache=1', {
                                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ path: curData.videoPath, time: seekTime, base64: res.base64 })
                                })
                                    .then(r => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
                                    .then(j => { if (!j || j.ret !== true) throw new Error('save failed'); })
                                    .catch(() => { curData.thumbSaveFails = (curData.thumbSaveFails || 0) + 1; });
                            }
                        })
                        .then(r => {
                            if (r === 'skip') return;
                            if ((curData.thumbSaveFails || 0) >= 3) {
                                console.error(`thumb cache save 실패 ${curFkey} - 썸네일 회전 중단`);
                                this.stop(curFkey);
                                this.showError(curFkey, curEl);
                                return;
                            }
                            if (!singleFrameMode && isPageFocused && this.active.has(curFkey)) this.tick(curFkey, curEl);
                        })
                        .catch(ex => { console.error(`thumb update error ${curFkey}`, ex); this.showError(curFkey, curEl); });
                    });
            },

            stopAll() {
                this.active.clear();
                this.errors.forEach(e => e.remove());
                this.errors.clear();
                thumbObserver.disconnect();
            },
            resumeAll() {
                gridEl.querySelectorAll('img[data-fkey]').forEach(img => {
                    const f = img.dataset.fkey;
                    if (!this.active.has(f)) {
                        const d = storeOf(f);
                        if (singleFrameMode && d && d.hasThumb && !d.needVideoLoad) return;
                        this.start(f, img);
                    }
                });
            }
        };

        const thumbObserver = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                const f = entry.target.dataset.fkey;
                if (!f) return;
                if (entry.isIntersecting) thumbMgr.start(f, entry.target);
                else thumbMgr.stop(f);
            });
        }, { threshold: 0.1 });

        const domRemovalObs = new MutationObserver(mutations => {
            mutations.forEach(m => {
                m.removedNodes.forEach(node => {
                    if (node.nodeType === Node.ELEMENT_NODE) {
                        const imgs = node.matches?.('img[data-fkey]') ? [node] : Array.from(node.querySelectorAll?.('img[data-fkey]') || []);
                        imgs.forEach(img => thumbMgr.stop(img.dataset.fkey));
                    }
                });
            });
        });
        domRemovalObs.observe(document.body, { childList: true, subtree: true });

        window.addEventListener('focus', () => { isPageFocused = true; thumbMgr.resumeAll(); });
        <!-- window.addEventListener('blur', () => { isPageFocused = false; thumbMgr.stopAll(); }); -->
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) { isPageFocused = false; thumbMgr.stopAll(); }
            else { isPageFocused = true; thumbMgr.resumeAll(); }
        });

        // ============================================================
        // VIDEO LOAD QUEUE
        // ============================================================
        function storeOf(fkey) { return makeitemStore[fkey]; }

        async function processVideoLoadQueue() {
            while (videoLoadQueue.length > 0 && activeVideoLoads < MAX_CONCURRENT_LOADS) {
                const info = videoLoadQueue.shift();
                activeVideoLoads++;

                const vid = info.element;
                if (!vid || !vid.parentElement) { activeVideoLoads--; continue; }

                let progContainer = vid.parentElement.querySelector(`.vid-progress[data-vidname="${CSS.escape(info.name)}"]`);
                if (!progContainer) {
                    progContainer = document.createElement('div');
                    progContainer.className = 'vid-progress';
                    progContainer.dataset.vidname = info.name;
                    const bar = document.createElement('div');
                    bar.className = 'vid-progress-bar';
                    bar.dataset.vidname = info.name;
                    progContainer.appendChild(bar);
                    vid.parentElement.insertBefore(progContainer, vid);
                }

                const videoPath = info.cacheKey || vid.src;
                const fallbackDur = 60;
                let videoDur = vid.duration;
                let durKnown = !!(videoDur && Number.isFinite(videoDur));
                if (!durKnown) {
                    await new Promise(res => {
                        const done = () => res();
                        if (vid.readyState >= 1 && Number.isFinite(vid.duration)) { done(); return; }
                        vid.addEventListener('loadedmetadata', done, { once: true });
                        vid.addEventListener('error', done, { once: true });
                        setTimeout(done, 4000);
                    });
                    videoDur = vid.duration;
                    durKnown = !!(videoDur && Number.isFinite(videoDur));
                    if (vid.error) {
                        activeVideoLoads--;
                        thumbMgr.showError(info.fkey, vid);
                        continue;
                    }
                }
                if (!durKnown) videoDur = fallbackDur;
                info.durKnown = durKnown;

                let seekTime;
                const bm = pickBookmarkTime(videoPath, durKnown ? videoDur : undefined);
                if (bm) { seekTime = bm; }
                else { seekTime = Math.random() * videoDur; if (seekTime < 30) seekTime = 30; }

                const cacheUrl = `bookmark_thumb.php?path=${encodeURIComponent(videoPath)}&time=${seekTime}`;
                console.log(`[thumb] ${info.fkey} 초기 로드 캐시 시도 seek=${seekTime}`);
                fetch(cacheUrl, { method: 'GET', cache: 'no-store' })
                    .then(r => { if (r.ok) return r.blob(); throw new Error('miss'); })
                    .then(blob => {
                        console.log(`[thumb] ${info.fkey} 초기 로드 캐시 이미지 완료`);
                        applyThumbnail(info, vid, URL.createObjectURL(blob), videoDur, seekTime, fallbackDur);
                    })
                    .catch(() => {
                        console.log(`[thumb] ${info.fkey} 초기 로드 캐시 미스 - FFmpeg 디코딩 시작`);
                        decodeAndApply(info, vid, videoPath, seekTime, videoDur, fallbackDur);
                    });
            }
        }

        function applyThumbnail(info, vid, imgSrc, dur, seekTime, fallbackDur) {
            const data = storeOf(info.fkey);
            if (data) {
                data.needVideoLoad = false;
                data.hasThumb = true;
                data.imgpath = imgSrc;
                data.videoPath = info.cacheKey || vid.src;
                data.videoDuration = dur;
                data.videoDurationKnown = info.durKnown !== false;
                data.currentSeekTime = parseFloat(seekTime);
            }

            if (vid.parentElement) {
                vid.pause();
                vid.removeAttribute('src');
                vid.load();

                const img = document.createElement('img');
                img.src = imgSrc;
                img.style.cssText = 'position:absolute;width:100%;height:100%;object-fit:cover;pointer-events:none;';
                img.alt = 'Video thumbnail';
                img.dataset.fkey = info.fkey;
                if (data && data.isVR) img.classList.add('vr-half');
                img.draggable = false;

                const bar = vid.parentElement.querySelector(`.vid-progress-bar[data-vidname="${CSS.escape(info.name)}"]`);
                if (bar) bar.style.width = `${Math.min(100, (parseFloat(seekTime) / dur) * 100)}%`;

                vid.parentElement.insertBefore(img, vid);
                vid.remove();

                if (data) data.progressBar = bar;
                thumbObserver.observe(img);
            }
        }

        function decodeAndApply(info, vid, videoPath, seekTime, dur, fallbackDur) {
            console.log(`[thumb] ${info.fkey} FFmpeg 디코딩 시작 seek=${seekTime}`);
            fetch(`${getFfmpegUrl()}/decode`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ videoPath, seekTime })
            })
            .then(r => { if (!r.ok) throw new Error(`FFmpeg ${r.status}`); return r.json(); })
            .then(res => {
                if (!res.success || !res.base64 || res.base64.length < 100) return;
                applyThumbnail(info, vid, res.base64, dur, seekTime, fallbackDur);
                console.log(`[thumb] ${info.fkey} FFmpeg 디코딩 완료`);
                const bms = getBookmarksForVideo(videoPath);
                if (bms) {
                    fetch('bookmark_thumb.php?cache=1', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ path: videoPath, time: parseFloat(seekTime), base64: res.base64 })
                    }).catch(() => {});
                }
            })
            .catch(ex => {
                console.error(`decode error ${info.fkey}`, ex);
                if (vid && vid.parentElement) thumbMgr.showError(info.fkey, vid);
            })
            .finally(() => { activeVideoLoads--; processVideoLoadQueue(); });
        }

        // ============================================================
        // MAKE CARD HTML
        // ============================================================
        async function makeCard(item) {
            const { fname, base, fkey } = item;
            let itemEnterable = false, itemImg = false, imgpath = '';
            let itemVid = false, needVideoLoad = false, vidpath = '';
            let hasMp4 = false, hasVR = false, hasHighImageRatio = false;
            let dirImgs4 = [];

            const cached = makeitemStore[fkey];
            if (cached) {
                return cached;
            }

            const belowPath = fkey;
            let cacheKey = '';

            try {
                let jsonData = null;
                if (dirFlagMap[fkey] !== false) {
                    jsonData = await dirseek(belowPath);
                }
                if (jsonData && jsonData.ret) {
                    itemEnterable = true;
                    let dirImgs = [], imageCount = 0;
                    jsonData.data.forEach(e => {
                        const ext = e.d.substring(e.d.lastIndexOf('.') + 1).toLowerCase();
                        if (isImageExt(ext)) { dirImgs.push(e.d); imageCount++; }
                        if (ext === 'mp4' || ext === 'mov' || ext === 'mkv') hasMp4 = true;
                        if (isVRByFilename(e.d)) hasVR = true;
                    });
                    const total = jsonData.data.length;
                    hasHighImageRatio = (total > 0 ? (imageCount / total) : 0) >= 0.9;
                    if (dirImgs.length > 0) {
                        itemImg = true;
                        // 랜덤 4장 선택 (2x2 사분할용)
                        const shuffled = dirImgs.slice().sort(() => Math.random() - 0.5);
                        const pickCount = Math.min(4, shuffled.length);
                        dirImgs4 = shuffled.slice(0, pickCount).map(n => joinPath(belowPath, encodeURIComponent(n)));
                        imgpath = dirImgs4[0];
                    }
                } else {
                    const ext = fname.substring(fname.lastIndexOf('.') + 1).toLowerCase();
                    if (isImageExt(ext)) {
                        itemImg = true;
                        imgpath = joinPath(base, encodeURIComponent(fname));
                    } else if (ext === 'mp4' || ext === 'mov' || ext === 'mkv') {
                        itemVid = true;
                        vidpath = joinPath(base, encodeURIComponent(fname));
                        needVideoLoad = true;
                    }
                }
            } catch (ex) { console.error(ex); }

            let isVR = false;
            if (itemVid) {
                isVR = makeitemStore[fkey]?.isVR;
                if (typeof isVR !== 'boolean') {
                    isVR = await isVRVideo(vidpath, fname);
                }
            }

            const ratingVal = await getRating(fname);

            const entry = {
                fname, base, fkey, itemEnterable, itemImg, imgpath, itemVid, needVideoLoad, vidpath,
                cacheKey, hasMp4, hasHighImageRatio, hasVR, isVR, rating: ratingVal,
                dirImgs4,
                hasThumb: false, progressBar: null, currentSeekTime: 0, videoDuration: null
            };
            makeitemStore[fkey] = entry;
            return entry;
        }

        function renderCard(item) {

            // Rating
            const ratingHtml = `

            // Title
            const titleHtml = `<div class="card-title-layer"><h3>${escapeHtml(fname)}</h3></div>`;

            // Image or Video
            let mediaHtml = '';

            if (itemImg && itemEnterable && dirImgs4 && dirImgs4.length >= 4) {
                // 폴더 카드: 2x2 사분할 이미지 (4장 이상)

                for (let i = 0; i < 4; i++) {

                mediaHtml = '<div class="card-split2">';

            }
            if (needVideoLoad) {
                const vrClass = isVR ? ' vr-half' : '';
                mediaHtml = `<img src="${escapeHtml(imgpath)}" loading="lazy" alt="Cover" class="${vrClass}" data-fkey="${escapeHtml(fkey)}" data-cache-key="${escapeHtml(cacheKeyForAttr)}" draggable="false" style="position:absolute;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none;-webkit-user-drag:none;">`;
                mediaHtml += `<video muted src="${escapeHtml(vidpath)}" preload="metadata" data-fkey="${escapeHtml(fkey)}" data-cache-key="${escapeHtml(cacheKeyForAttr)}" style="position:absolute;width:100%;height:100%;object-fit:cover;"></video>`;
            }

            inner.innerHTML = linksHtml + badgesHtml + ratingHtml + titleHtml + mediaHtml;
            card.appendChild(inner);

            // Observe thumbnail img
            const thumbImg = inner.querySelector('img[data-fkey]');
            if (thumbImg) {
                thumbObserver.observe(thumbImg);
                thumbMgr.setupProgress(card, fkey);
            }

            // Video queue
            const vidEl = inner.querySelector('video');
            if (vidEl) {
                const vidName = vidEl.src.substring(vidEl.src.lastIndexOf('/') + 1);
                videoLoadQueue.push({
                    name: decodeURI(vidName),
                    element: vidEl,
                    fkey,
                    cacheKey: cacheKeyForAttr
                });
            }

            return card;
        }

        // ============================================================
        // RATING EVENT DELEGATION
        // ============================================================
        document.addEventListener('click', e => {
            const btn = e.target.closest('.cr-btn[data-rating-action]');
            if (!btn) return;
            const fname = btn.dataset.ratingFname;
            const fkey = btn.dataset.ratingFkey;
            if (!fname || !fkey) return;
            if (btn.dataset.ratingAction === 'up') onRatingUp(fkey, fname);
            else onRatingDown(fkey, fname);
        });

        function storeEntriesByName(fname) {
            return Object.values(makeitemStore).filter(e => e.fname === fname);
        }

        async function onRatingUp(fkey, fname) {
            const cur = makeitemStore[fkey]?.rating ?? 0;
            const next = cur + 1;
            if (await setRating(fname, next)) {
                storeEntriesByName(fname).forEach(e => { e.rating = next; });
                document.querySelectorAll(`[data-rating-fname="${fname}"] .cr-val`).forEach(el => { el.textContent = next; });
            }
        }

        async function onRatingDown(fkey, fname) {
            const cur = makeitemStore[fkey]?.rating ?? 0;
            const next = cur - 1;
            if (await setRating(fname, next)) {
                storeEntriesByName(fname).forEach(e => { e.rating = next; });
                document.querySelectorAll(`[data-rating-fname="${fname}"] .cr-val`).forEach(el => { el.textContent = next; });
            }
        }

        // ============================================================
        // RENDER GRID
        // ============================================================
        function getColsCount() {
            const w = gridEl.clientWidth;
            const minW = SIZE_LEVELS[cardSizeIdx] + 10;
            return Math.max(1, Math.floor(w / minW));
        }

        function getVisibleRange() {
            const cols = getColsCount();
            const ch = getCardHeight();
            const scrollTop = window.scrollY;
            const viewH = window.innerHeight;
            const startRow = Math.max(0, Math.floor(scrollTop / ch) - BUFFER_ROWS);
            const endRow = Math.ceil((scrollTop + viewH) / ch) + BUFFER_ROWS;
            return { startIdx: startRow * cols, endIdx: Math.min(endRow * cols, dirlist.length), cols };
        }

        async function renderCardAt(idx) {
            if (idx < 0 || idx >= dirlist.length) return;
            const placeholder = gridEl.children[idx];
            if (!placeholder || placeholder.dataset.rendered === '1') return;
            placeholder.dataset.rendered = '1';
            const item = dirlist[idx];
            const cardData = await makeCard(item);
            const card = renderCard(cardData);
            card.dataset.itemFkey = item.fkey;
            placeholder.replaceWith(card);
        }

        function pruneOffscreen() {
            const { startIdx, endIdx } = getVisibleRange();
            const pruneStart = Math.max(0, startIdx - BUFFER_ROWS * 4);
            const pruneEnd = Math.min(dirlist.length, endIdx + BUFFER_ROWS * 4);
            Array.from(gridEl.children).forEach((el, idx) => {
                if (idx >= pruneStart && idx < pruneEnd) return;
                if (el.dataset.rendered !== '1') return;
                const fkey = el.dataset.itemFkey;
                if (fkey) {
                    el.querySelectorAll('video').forEach(v => { v.pause(); v.removeAttribute('src'); v.load(); });
                    thumbMgr.stop(fkey);
                }
                const ph = document.createElement('div');
                ph.className = 'card';
                ph.style.visibility = 'hidden';
                ph.dataset.virtualIdx = idx;
                gridEl.replaceChild(ph, el);
                cardObserver.observe(ph);
            });
        }

        async function renderGrid() {
            gridEl.innerHTML = '';
            emptyState.style.display = 'none';
            thumbMgr.stopAll();
            cardObserver.disconnect();
            videoLoadQueue = [];
            lastScrollRow = -1;

            if (dirlist.length === 0) {
                emptyState.style.display = 'block';
                emptyTitle.textContent = activeFavMode ? '즐겨찾기 항목이 없습니다'
                    : (parampathgiven ? `${parampath} 에 파일이 없습니다` : '디렉토리를 지정해주세요');
                const overlay = document.getElementById('loading-overlay');
                if (overlay && !overlay.classList.contains('hidden')) {
                    overlay.classList.add('hidden');
                    setTimeout(() => overlay.remove(), 400);
                }
                return;
            }

            const { startIdx, endIdx } = getVisibleRange();
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < dirlist.length; i++) {
                if (i >= startIdx && i < endIdx) {
                    const item = dirlist[i];
                    const cardData = await makeCard(item);
                    const card = renderCard(cardData);
                    card.dataset.itemFkey = item.fkey;
                    card.dataset.rendered = '1';
                    fragment.appendChild(card);
                } else {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'card';
                    placeholder.dataset.virtualIdx = i;
                    placeholder.dataset.rendered = '0';
                    fragment.appendChild(placeholder);
                }
            }

            gridEl.appendChild(fragment);

            gridEl.querySelectorAll('.card[data-rendered="0"]').forEach(el => {
                cardObserver.observe(el);
            });

            processVideoLoadQueue();

            const overlay = document.getElementById('loading-overlay');
            if (overlay && !overlay.classList.contains('hidden')) {
                overlay.classList.add('hidden');
                setTimeout(() => overlay.remove(), 400);
            }
        }

        function onScroll() {
            if (dirlist.length === 0) return;
            const ch = getCardHeight();
            const curRow = Math.floor(window.scrollY / ch);
            if (curRow !== lastScrollRow) {
                lastScrollRow = curRow;
                pruneOffscreen();
            }
            if (scrollDebounceTimer) clearTimeout(scrollDebounceTimer);
            scrollDebounceTimer = setTimeout(() => {
                scrollDebounceTimer = null;
            }, SCROLL_DEBOUNCE);
        }

        window.addEventListener('scroll', onScroll, { passive: true });

        // ============================================================
        // SORT & FILTER
        // ============================================================
        let ordertype = 1;
        let ratingordertoggle = false;

        function shuffleWithSeed(arr, seed) {
            const rng = (function(s) {
                return function() {
                    let t = s += 0x6D2B79F5;
                    t = Math.imul(t ^ (t >>> 15), t | 1);
                    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            })(seed);
            const r = [...arr];
            for (let i = r.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [r[i], r[j]] = [r[j], r[i]];
            }
            return r;
        }

        function stringToSeed(s) {
            let h = 0;
            for (let i = 0; i < s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i);
            return h >>> 0;
        }

        function todayStr() {
            const d = new Date();
            return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
        }

        let startupprocessing = false;
        let startupRerun = false;
        let activeFavMode = false;
        let initialToastShown = false;
        async function startup() {
            if (startupprocessing) { startupRerun = true; return; }
            startupprocessing = true;
            try {
                await startupBody();
            } finally {
                startupprocessing = false;
                if (startupRerun) { startupRerun = false; startup(); }
            }
        }
        async function startupBody() {
            const isFav = favMode;
            activeFavMode = isFav;
            gridEl.innerHTML = '';
            thumbMgr.stopAll();
            thumbMgr.errors.clear();
            makeitemStore = {};
            vid180Cache = {};
            videoLoadQueue = [];

            const loadProg = document.getElementById('loadingProgress');

            loadAllBookmarks();
            await loadFavorites();

            const prefs = getPathPref();
            ordertype = prefs.order ?? localStorage.getItem('listordertype') ?? 1;
            ratingordertoggle = prefs.ratingToggle ?? localStorage.getItem('ratingordertoggle') ?? false;
            if (ratingordertoggle === 'true') ratingordertoggle = true;
            else if (ratingordertoggle === 'false') ratingordertoggle = false;

            updateSortButtons();
            updateRatingToggleBtn();
            updateSingleFrameBtn();
            updateFavBtn();
			
			console.log(`ordertype - ${ordertype}`);
			
            if (!initialToastShown && parampathgiven) {
                initialToastShown = true;	
            }

            if (loadProg) loadProg.textContent = isFav ? '즐겨찾기 조회 중...' : '디렉토리 조회 중...';
            let list = [];
            if (isFav) {
                try {
                    const favRes = await fetch('favorite.php?all=1', { cache: 'no-store' });
                    const favJson = await favRes.json();
                    const favData = (favJson.ret && favJson.data) || {};
                    // 범위: 현재 경로 하위 항목만 표시 (루트 진입 시 전체)
                    const favScope = parampathgiven ? favNorm(parampath).replace(/\/+$/, '') : '';
                    list = Object.keys(favData)
                        .filter(path => !favScope || favNorm(path).startsWith(favScope + '/'))
                        .map(path => ({
                            d: path.substring(path.lastIndexOf('/') + 1),
                            favPath: path,
                            favCreated: favData[path]?.created ?? 0,
                            favDir: typeof favData[path]?.dir === 'boolean' ? favData[path].dir : undefined
                        }));
                } catch (e) {
                    console.error('favorites fetch failed', e);
                    list = [];
                }
            } else {
                const json = await dirseek(parampath);
                if (!json.ret) {
                    emptyState.style.display = 'block';
                    emptyTitle.textContent = `${parampath} dirseek 오류`;
                    const overlay = document.getElementById('loading-overlay');
                    if (overlay && !overlay.classList.contains('hidden')) {
                        overlay.classList.add('hidden');
                        setTimeout(() => overlay.remove(), 400);
                    }
                    return;
                }
                list = json.data;
            }

            dirFlagMap = {};
            dirlist = [];

            list.forEach(e => {
                const name = e.d;
                let fkey, base, time;
                if (isFav) {
                    fkey = e.favPath;
                    base = splitPath(fkey).base;
                    time = e.favCreated;
                } else {
                    base = parampath;
                    fkey = joinPath(parampath, name);
                    time = Date.parse(e.t);
                }
                const dirFlag = isFav ? e.favDir : e.dir;
                if (dirFlag !== undefined) dirFlagMap[fkey] = dirFlag;

                let ftext = name;
                try {
                    let p1 = ftext.indexOf('/');
                    if (p1 >= 0) { ftext = ftext.substring(p1 + 1); p1 = ftext.indexOf('/'); ftext = ftext.substring(0, p1); }
                } catch (ex) { ftext = ''; }

                dirlist.push({ fname: name, text: ftext, time, base, fkey });
            });

            if (paramfind != null) {
                const q = paramfind.toUpperCase();
                dirlist = dirlist.filter(x => (isFav ? x.fkey : x.fname).toUpperCase().includes(q));
            }

            if (dirlist.length > 0) {
                if (loadProg) loadProg.textContent = `${dirlist.length}개 항목 정렬 중...`;
                if (ordertype === 1) dirlist.sort((a, b) => b.time - a.time);
                else if (ordertype === 2) dirlist.sort((a, b) => a.fname.localeCompare(b.fname));
                else if (ordertype === 3) dirlist = shuffleWithSeed(dirlist, stringToSeed(todayStr()));
                else if (ordertype === 4) dirlist = shuffleWithSeed(dirlist, Math.random() * 0xFFFFFFFF);

                if (ratingordertoggle) {
                    const promises = dirlist.map(async item => { item.rating = await getRating(item.fname); });
                    await Promise.all(promises);
                    dirlist = shuffleWithSeed(dirlist, Math.random() * 0xFFFFFFFF);
                    dirlist.sort((a, b) => (b.rating ?? 0) - (a.rating ?? 0));
                }

                dirlist = dirlist.filter(item => {
                    const t = item.text.toLowerCase();
                    return !(t.endsWith('.jpg') || t.endsWith('.jpeg') || t.endsWith('.png') || t.endsWith('.sh'))
                        || t.endsWith('.mp4') || t.endsWith('.mov') || t.endsWith('.mkv');
                });

                dirlist.sort((a, b) => Number(b.text.endsWith('.mp4') || b.text.endsWith('.mov') || b.text.endsWith('.mkv'))
                    - Number(a.text.endsWith('.mp4') || a.text.endsWith('.mov') || a.text.endsWith('.mkv')));

                const imgfiles = dirlist.filter(x => isImageExt(x.fname));
                if (imgfiles.length / dirlist.length > 0.9) {
                    dirlist.sort((a, b) => {
                        const numA = extractNum(a.fname);
                        const numB = extractNum(b.fname);
                        return numA - numB;
                    });
                }
            }

            if (loadProg) loadProg.textContent = '카드 렌더링 중...';
            try {
                await renderGrid();
            } catch (e) {
                console.error('renderGrid error', e);
            }

            const overlay = document.getElementById('loading-overlay');
            if (overlay && !overlay.classList.contains('hidden')) {
                overlay.classList.add('hidden');
                setTimeout(() => overlay.remove(), 400);
            }
        }

        function extractNum(str) {
            const dot = str.lastIndexOf('.');
            let s = dot === -1 ? str : str.substring(0, dot);
            if (!isNaN(s)) return Number(s);
            for (let i = s.length - 1; i >= 0; i--) {
                if (isNaN(s[i])) return Number(s.substring(i + 1));
            }
            return -1;
        }

        function updateRatingToggleBtn() {
            document.getElementById('btnRatingToggle').classList.toggle('active', ratingordertoggle);
        }

        function updateSingleFrameBtn() {
            document.getElementById('btnSingleFrame').classList.toggle('active', singleFrameMode);
        }

        function updateSortButtons() {
            document.querySelectorAll('[data-sort]').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.sort) === ordertype);
            });
        }

        document.querySelectorAll('[data-sort]').forEach(btn => {
            btn.addEventListener('click', () => {
                ordertype = parseInt(btn.dataset.sort);
                setPathPref({ order: ordertype });
                updateSortButtons();
                startup();
            });
        });

        document.getElementById('btnRatingToggle').addEventListener('click', () => {
            ratingordertoggle = !ratingordertoggle;
            setPathPref({ ratingToggle: ratingordertoggle });
            updateRatingToggleBtn();
            showToast(`별점 정렬: ${ratingordertoggle ? 'ON' : 'OFF'}`);
            startup();
        });

        document.getElementById('btnSingleFrame').addEventListener('click', () => {
            toggleSingleFrameMode();
            updateSingleFrameBtn();
        });

        document.getElementById('btnSizeDown').addEventListener('click', () => setCardSize(cardSizeIdx - 1));
        document.getElementById('btnSizeUp').addEventListener('click', () => setCardSize(cardSizeIdx + 1));

        document.getElementById('btnBookmarks').addEventListener('click', () => {
            window.open(`${BASE_DIR}bookmarks.html?p=${parampath || ''}`, '_blank');
        });

        // ============================================================
        // FAVORITE SESSION (fav=1 URL 분기)
        // ============================================================
        function updateFavBtn() {
            document.getElementById('btnFavorites').classList.toggle('active', favMode);
        }

        function setFavMode(on) {
            if (on === favMode) return;
            favMode = on;
            const url = new URL(window.location.href);
            if (on) url.searchParams.set('fav', '1');
            else url.searchParams.delete('fav');
            history.pushState({}, '', url);
            window.scrollTo(0, 0);
            updateFavBtn();
            showToast(on ? '즐겨찾기 세션 진입' : '즐겨찾기 세션 이탈');
            startup();
        }

        // 진입은 항상 새 탭 (토글 아님) — 현재 탭은 그대로 유지
        function openFavSession() {
            if (favMode) {
                showToast('이미 즐겨찾기 세션입니다');
                return;
            }
            const url = new URL(window.location.href);
            url.searchParams.set('fav', '1');
            window.open(url.toString(), '_blank');
            showToast('즐겨찾기 세션 새 탭 열기');
        }

        document.getElementById('btnFavorites').addEventListener('click', openFavSession);

        window.addEventListener('popstate', () => {
            const on = new URL(window.location.href).searchParams.get('fav') === '1';
            if (on !== favMode) {
                favMode = on;
                updateFavBtn();
                startup();
            }
        });

        document.getElementById('btnHelp').addEventListener('click', () => {
            document.getElementById('helpModal').classList.toggle('show');
        });

        // ============================================================
        // HEADER SEARCH
        // ============================================================
        headerSearchInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
				
				if (headerSearchInput.value.length === 0) {
					headerSearchInput.blur();
					return;
				}
					
                const q = headerSearchInput.value.trim();
                if (!q) {
                    if (paramfind) {
                        let href = window.location.href;
                        href = href.substring(0, href.lastIndexOf('&f='));
                        window.location = href;
                    }
                    return;
                }
                let href = window.location.href;
                while (href.lastIndexOf('&f=') !== -1) href = href.substring(0, href.lastIndexOf('&f='));
                window.open(`${href}&f=${q}`, '_blank');
				
				headerSearchInput.value = '';
                headerSearchInput.blur();
				
            } else if (e.key === 'Escape') {
                headerSearchInput.value = '';
                headerSearchInput.blur();
            }
        });

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                document.getElementById('helpModal').classList.remove('show');
                if (document.activeElement === headerSearchInput) headerSearchInput.blur();
                return;
            }

            if (e.target.tagName === 'INPUT') return;

            if (e.key === 'Enter') {
                e.preventDefault();
                if (e.target === headerSearchInput) return;
                headerSearchInput.value = '';
                headerSearchInput.focus();
            } else if (e.key === '\\') {
                showToast('강제 새로고침');
                startup();
            } else if (e.key === 'b') {
                showToast('북마크 열기');
                window.open(`${BASE_DIR}bookmarks.html?p=${parampath || ''}`, '_blank');
            } else if (e.key === 'f') {
                openFavSession();
            } else if (e.key === '0') {
                ratingordertoggle = !ratingordertoggle;
                setPathPref({ ratingToggle: ratingordertoggle });
                updateRatingToggleBtn();
                showToast(`별점 정렬: ${ratingordertoggle ? 'ON' : 'OFF'}`);
                startup();
            } else if (e.key === 's') {
                toggleSingleFrameMode();
                updateSingleFrameBtn();
            } else if (e.key === '+') {
                setCardSize(cardSizeIdx + 1);
            } else if (e.key === '-') {
                setCardSize(cardSizeIdx - 1);
            } else if (e.key === 'Backspace') {
                if (favMode) { setFavMode(false); return; }
                let link = window.location.href;
                if (link.lastIndexOf('&f=') !== -1) {
                    window.location = link.substring(0, link.lastIndexOf('&f='));
                } else {
                    let up = link.substring(0, link.lastIndexOf('/'));
                    if (!up.endsWith('drvs')) window.location = up;
                }
            } else if (e.key === '?') {
                document.getElementById('helpModal').classList.toggle('show');
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', startup);

    })();
    </script>
</body>
