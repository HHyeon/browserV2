<html>
    <head>
        <meta charset="utf-8">
        <title>videoviewer</title>

        <style>
            *{
                margin: 0px;
            }

            body {
                margin:0;
                background-color: rgb(25, 25, 25);
                color: aliceblue;
                overflow-y: hidden; /* Hide vertical scrollbar */
                overflow-x: hidden; /* Hide horizontal scrollbar */
                text-align: center;
                display:flex;
                align-items:center;
                justify-content:center;
                overflow:hidden;
            }

            .container video {
                max-width:none;
                max-height:none;
                object-fit:none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;

                filter: saturate(1) contrast(1) brightness(1);
                /*transition: filter 0.3s ease;
                transition: transform 0.2s ease-in-out;*/
            }
            
            #label1 {
                position:fixed;
                left: 2%;
                top: 2%;
                background-color: rgba(0, 0, 0, 0.2);
            }

            #viewbox {
                position: fixed;
                bottom: 10px;
                right: 10px;
                width: 120px;
                height: 120px;
                border: 1px solid rgba(255,255,255,0.7);
                background: rgba(255,255,255,0.05);
                box-sizing: border-box;
                pointer-events: none; /* overlay should not block mouse events */
                z-index: 1000;
            }
            #viewbox-zoom {
                position: absolute;
                border: 1px solid rgba(255,0,0,0.8);
                background: rgba(255,0,0,0.2);
                box-sizing: border-box;
            }
            
            #progress-panel {
                position: fixed;
                bottom: 5vh;
                left: calc(100vw / 3);
                width: calc(100vw / 3);
                transform: translate(0, 0);
                background-color: rgba(0, 0, 0, 0.7);
                border-radius: 8px;
                padding: 12px 16px;
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.3s ease, visibility 0.3s ease;
                z-index: 1000;
                box-sizing: border-box;
            }

            #progress-time {
                font-size: 1vmin;
                /* font-family: ; */
            }

            #progress-bar-container {
                width: 100%;
                height: 2vmin;
                background-color: rgba(255, 255, 255, 0.3);
                border-radius: 4px;
                overflow: hidden;
                cursor: pointer;
                position: relative;
            }

            #progress-bar {
                height: 100%;
                background-color: rgba(100, 180, 255, 0.9);
                border-radius: 4px;
                width: 0%;
                transition: width 0.1s linear;
                pointer-events: none;
            }

            #progress-link {
                font-size: 1.2vmin;
                color: rgba(255, 255, 255, 0.7);
                text-decoration: none;
                padding: 2px 6px;
                background-color: rgba(255, 255, 255, 0.1);
                border-radius: 3px;
                pointer-events: auto;
            }

            #progress-link:hover {
                background-color: rgba(255, 255, 255, 0.2);
            }

            #progress-top-row {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 8px;
                margin-bottom: 8px;
            }

            #progress-bookmark-btns {
                display: flex;
                gap: 4px;
            }

            .progress-bookmark-btn {
                background-color: rgba(255, 255, 255, 0.1);
                border: none;
                border-radius: 4px;
                color: rgba(255, 255, 255, 0.8);
                font-size: 1.2vmin;
                padding: 2px 6px;
                cursor: pointer;
                pointer-events: auto;
                transition: background-color 0.15s ease;
            }

            .progress-bookmark-btn:hover {
                background-color: rgba(255, 255, 255, 0.25);
            }

            .bookmark-marker {
                position: absolute;
                top: 0;
                width: 3px;
                height: 100%;
                background-color: rgba(255, 80, 80, 0.9);
                pointer-events: auto;
                cursor: pointer;
                z-index: 2;
                transition: background-color 0.15s ease;
            }
            .bookmark-marker:hover {
                background-color: rgba(255, 200, 80, 1);
                width: 5px;
                margin-left: -1px;
            }
            .bookmark-marker[title]:hover::after {
                content: attr(title);
                position: absolute;
                bottom: 120%;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0,0,0,0.85);
                color: #fff;
                font-size: 11px;
                padding: 2px 6px;
                border-radius: 3px;
                white-space: nowrap;
                pointer-events: none;
            }

            #bookmark-panel {
                position: fixed;
                top: 5vh;
                right: 10px;
                min-width: 200px;
                max-width: 320px;
                max-height: 60vh;
                overflow-y: auto;
                background-color: rgba(0, 0, 0, 0.8);
                border-radius: 8px;
                padding: 8px;
                z-index: 1000;
                box-sizing: border-box;
                opacity: 1;
                visibility: visible;
                transition: opacity 0.3s ease, visibility 0.3s ease;
                text-align: left;
                font-size: 14px;
            }

            #bookmark-panel.hidden {
                opacity: 0;
                visibility: hidden;
            }

            .bookmark-row {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 4px 6px;
                border-radius: 4px;
                cursor: pointer;
                user-select: none;
            }

            .bookmark-row:hover {
                background-color: rgba(255, 255, 255, 0.1);
            }

            .bookmark-row.active {
                background-color: rgba(100, 180, 255, 0.25);
                outline: 1px solid rgba(100, 180, 255, 0.7);
            }

            .bookmark-row .bookmark-time {
                color: rgba(100, 180, 255, 0.9);
                min-width: 40px;
            }

            .bookmark-row .bookmark-name {
                flex: 1;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                color: rgba(255, 255, 255, 0.6);
                font-size: 12px;
            }

            .bookmark-row .bookmark-del {
                color: rgba(255, 100, 100, 0.9);
                padding: 0 4px;
                cursor: pointer;
                user-select: none;
            }

            .bookmark-empty {
                color: rgba(255, 255, 255, 0.5);
                padding: 8px;
                text-align: center;
            }

        </style>
    </head>
    <body draggable="false">

        <div draggable="false" class="container">
            <video id="player" buffered autoplay></video>

            <h1 id="label1"></h1>
        </div>

        <div id="progress-panel">
            <div id="progress-top-row">
                <div id="progress-bookmark-btns">
                    <button class="progress-bookmark-btn" id="btn-bookmark-prev">&#9664;</button>
                    <button class="progress-bookmark-btn" id="btn-bookmark-add">&#9733;</button>
                    <button class="progress-bookmark-btn" id="btn-bookmark-next">&#9654;</button>
                </div>
                <div id="progress-time">
                    <span id="progress-current">00:00</span>
                    <span id="progress-separator"> / </span>
                    <span id="progress-total">00:00</span>
                </div>
                <a id="progress-link" href="#" target="_blank">Link</a>
            </div>
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
        </div>

        

        <div id="bookmark-panel"></div>

        <div id="viewbox" style="visibility:hidden;">
            <div id="viewbox-zoom"></div>
        </div>
        
        
        <script src="player-common.js"></script>
        <script>

            const pc = createPlayerCommon({
                volumeStep: 0.01,
                initialVolume: 0.2,
                showProgressAfterSeek: false,
            });

            pc.init({
                label1: document.getElementById("label1"),
                progressPanel: document.getElementById('progress-panel'),
                progressBar: document.getElementById('progress-bar'),
                progressCurrent: document.getElementById('progress-current'),
                progressTotal: document.getElementById('progress-total'),
                progressBarContainer: document.getElementById('progress-bar-container'),
                progressLink: document.getElementById('progress-link'),
                bookmarkPanel: document.getElementById('bookmark-panel'),
            });

            const player = document.getElementById("player");

            const zoomBoxview = document.getElementById('viewbox');
            
            function updateViewbox() {
                const viewer = player;
                if (!viewer.videoWidth || !viewer.videoHeight) return;

                const rect = viewer.getBoundingClientRect();
                const vw = window.innerWidth;
                const vh = window.innerHeight;

                // intersection of image rect with viewport
                const x1 = Math.max(0, rect.left);
                const y1 = Math.max(0, rect.top);
                const x2 = Math.min(vw, rect.right);
                const y2 = Math.min(vh, rect.bottom);
                const visibleW = x2 - x1;
                const visibleH = y2 - y1;

                // map to image coordinates
                const scaleX = viewer.videoWidth / rect.width;
                const scaleY = viewer.videoHeight / rect.height;
                const leftImg = (x1 - rect.left) * scaleX;
                const topImg  = (y1 - rect.top) * scaleY;
                const wImg    = visibleW * scaleX;
                const hImg    = visibleH * scaleY;

                const zoomBox = document.getElementById('viewbox-zoom');
                zoomBox.style.left   = (leftImg / viewer.videoWidth * 100) + '%';
                zoomBox.style.top    = (topImg  / viewer.videoHeight * 100) + '%';
                zoomBox.style.width  = (wImg    / viewer.videoWidth * 100) + '%';
                zoomBox.style.height = (hImg    / viewer.videoHeight * 100) + '%';
            }
            

            let dirlist = null;
            let currentfilename;
            let currentdir;

            player.addEventListener("timeupdate", (event) => {
                pc.updateProgressPanel();
                pc.updateActiveBookmark();
            });

            let setplaytime = false;
            let PANNINGZOOM_VIEW_SCALE_DEFAULT = 0;
            let PANNINGZOOM_VIEW_SCALE_PIXCELMATCH = 0.0;
            let PANNINGZOOM_VIEW_SCALE = 0.00;
            let zoomPanningStayed = false;
            
            let startX = 0, startY = 0;
            let currTranslateX = 0, currTranslateY = 0;

            function ExitZoomPanning(screenfull = false) {
                    
                const resetscale = Math.min(window.innerWidth / player.videoWidth, window.innerHeight / player.videoHeight);
                PANNINGZOOM_VIEW_SCALE_PIXCELMATCH = PANNINGZOOM_VIEW_SCALE_DEFAULT = resetscale;

                PANNINGZOOM_VIEW_SCALE = PANNINGZOOM_VIEW_SCALE_DEFAULT;

                zoomPanningStayed = false;
                player.style.scale = PANNINGZOOM_VIEW_SCALE;
                console.log(`initial PANNINGZOOM_VIEW_SCALE - ${PANNINGZOOM_VIEW_SCALE}`);
                
                currTranslateX = 0;
                currTranslateY = 0;
                player.style.transform = `translate(${currTranslateX}px, ${currTranslateY}px)`;
                
                zoomBoxview.style.visibility = 'hidden';
            }

            function FullZoomPanning() {
                zoomPanningStayed = true;
                const resetscale = Math.max(window.innerWidth / player.videoWidth, window.innerHeight / player.videoHeight);
                PANNINGZOOM_VIEW_SCALE = resetscale;
                zoomPanning_Update();
            }

            function ToggleFullZoomPanning() {

                zoomPanningStayed = !zoomPanningStayed;
                if(zoomPanningStayed) {
                    FullZoomPanning();
                }
                else {
                    ExitZoomPanning();
                }
            }

            window.addEventListener("resize", () => {

                const resetscale = Math.min(window.innerWidth / player.videoWidth, window.innerHeight / player.videoHeight);
                PANNINGZOOM_VIEW_SCALE_PIXCELMATCH = PANNINGZOOM_VIEW_SCALE_DEFAULT = resetscale;

                if(zoomPanningStayed) {
                    FullZoomPanning();
                }
                else
                {
                    ExitZoomPanning();
                }

                if(document.fullscreenElement) {
                    zoomBoxview.style.visibility = 'hidden';
                }
                else {
                    if(zoomPanningStayed)
                        zoomBoxview.style.visibility = 'visible';
                }

            });
            

            function ZoomInOut(zoom, mX, mY) {
                let exitzoom = false;

                if(zoom) {
                    PANNINGZOOM_VIEW_SCALE *= 1.1; // Zoom in

                    zoomPanningStayed = true;

                    if(PANNINGZOOM_VIEW_SCALE > PANNINGZOOM_VIEW_SCALE_PIXCELMATCH * 5) {
                        PANNINGZOOM_VIEW_SCALE = PANNINGZOOM_VIEW_SCALE_PIXCELMATCH * 5;
                    }
                }
                else  {
                    PANNINGZOOM_VIEW_SCALE /= 1.1; // Zoom out
                    if(PANNINGZOOM_VIEW_SCALE < PANNINGZOOM_VIEW_SCALE_DEFAULT) {
                        PANNINGZOOM_VIEW_SCALE = PANNINGZOOM_VIEW_SCALE_DEFAULT;
                        exitzoom = true;
                    }
                }

                if(exitzoom) {
                    ExitZoomPanning();
                    console.log(`exit zoompanning !`);
                }
                else {
                    zoomPanning_start(mX,mY);
                }

            }
            
            function zoomPanning_start(mX, mY) {
                let mousexinmgs_beforezoom = mX - player.getBoundingClientRect().left;
                let mouseyinmgs_beforezoom = mY - player.getBoundingClientRect().top;

                let mousexinmgs_realimg = (mousexinmgs_beforezoom / player.getBoundingClientRect().width) * player.videoWidth;
                let mouseyinmgs_realimg = (mouseyinmgs_beforezoom / player.getBoundingClientRect().height) * player.videoHeight;
                let mouseXfromcenter = mX - window.innerWidth/2;
                let mouseYfromcenter = mY - window.innerHeight/2;
                
                mousexinmgs_realimg -= mouseXfromcenter / PANNINGZOOM_VIEW_SCALE;
                mouseyinmgs_realimg -= mouseYfromcenter / PANNINGZOOM_VIEW_SCALE;

                currTranslateX = player.videoWidth/2 - mousexinmgs_realimg;
                currTranslateY = player.videoHeight/2 - mouseyinmgs_realimg;
                startX = mX;
                startY = mY;

                zoomPanning_Update();
            }

                
            function zoomPanning_move(mX, mY) {
                const deltaX = (mX - startX) / PANNINGZOOM_VIEW_SCALE;
                const deltaY = (mY - startY) / PANNINGZOOM_VIEW_SCALE;
                currTranslateX += deltaX;
                currTranslateY += deltaY;

                startX = mX;
                startY = mY;
                
                zoomPanning_Update();
            }
            

            function zoomPanning_Update() {
                const maxTranslateX = player.videoWidth/2 - (window.innerWidth/2/PANNINGZOOM_VIEW_SCALE);
                const maxTranslateY = player.videoHeight/2 - (window.innerHeight/2/PANNINGZOOM_VIEW_SCALE);

                if(maxTranslateX < 0) currTranslateX = 0;
                else currTranslateX = Math.max(-maxTranslateX, Math.min(maxTranslateX, currTranslateX));
                if(maxTranslateY < 0) currTranslateY = 0;
                else currTranslateY = Math.max(-maxTranslateY, Math.min(maxTranslateY, currTranslateY));

                player.style.transform = `translate(${currTranslateX}px, ${currTranslateY}px)`;
                player.style.maxWidth = 'none';
                player.style.maxHeight = 'none';
                player.style.objectFit = 'none';
                player.style.scale = PANNINGZOOM_VIEW_SCALE;

                zoomBoxview.style.visibility = 'visible';
                updateViewbox();
            }
            

            window.addEventListener("wheel", function(e) {
                const wheelamount = e.deltaY * window.devicePixelRatio;

                if(wheelamount >= 100) {
                    ZoomInOut(false, e.clientX, e.clientY);
                    pc.setLabelText(`zoom:  ${(PANNINGZOOM_VIEW_SCALE / PANNINGZOOM_VIEW_SCALE_PIXCELMATCH).toFixed(1)}`);
                } else if(wheelamount <= -100) {
                    ZoomInOut(true, e.clientX, e.clientY);
                    pc.setLabelText(`zoom:  ${(PANNINGZOOM_VIEW_SCALE / PANNINGZOOM_VIEW_SCALE_PIXCELMATCH).toFixed(1)}`);
                }
                
            });

            window.addEventListener('focus', () => {

                if(pc.skip_pause)
                {
                    pc.setLabelText("skip play");
                    return;
                }
                
                if(player.style.visibility == '')
                {
                    pc.player_paused_state = false;
                    player.play();
                    pc.setLabelText("play");
                }
                else
                {

                }
            });
            window.addEventListener('blur', () => {
                if(pc.skip_pause)
                {
                    pc.setLabelText("skip pause");
                    return;
                }
                pc.player_paused_state = true;
                player.pause();
                pc.setLabelText("pause");
            });



            let shuffleidx=0;
            let shuffled = false;

            async function onKeydown(param)
            {
                console.log(param.key);

                switch(param.key){

                    case '/':
                        pc.skip_pause = !pc.skip_pause;
                        if(pc.skip_pause) pc.setLabelText(`skip blur pause`);
                        else pc.setLabelText(`skip blur pause disabled`);
                    break;

                    case 'Backspace':
                        if(player.style.visibility == '')
                        {
                            player.style.visibility='hidden';

                            pc.player_paused_state = false;
                            pc.pauseplay();
                            
                            if (document.exitFullscreen)
                                document.exitFullscreen()
                        }
                        else
                        {
                            player.style.visibility='';
                            
                            pc.player_paused_state = true;
                            pc.pauseplay();

                        }
                    break;
                    
                    case 'm':
                        pc.muteState = !pc.muteState;
                        if(pc.muteState)
                        {
                            pc.mutevolumestore = player.volume;
                            player.volume = 0.00;
                            pc.setLabelText("Muted");
                        }
                        else
                        {
                            player.volume = pc.mutevolumestore;
                            
                            pc.setLabelText(`volumn: ${parseInt(player.volume*100)}%`);
                        }
                    break;

                    case '\\':
                        {
                            if(dirlist.length > 1)
                            {
                                if(!shuffled)
                                {
                                    shuffleidx = 0;
                                    dirlist.sort(() => Math.random() - 0.5);
                                    shuffled = true;
                                }

                                currentfilename = dirlist[shuffleidx]['d'];
                                shuffleidx++;
                                if(shuffleidx >= dirlist.length) shuffleidx = 0;

                                const nextvidpath = currentdir + '/' + currentfilename;
                                player.src = nextvidpath; 
                                
                                await pc.loadBookmarksFor(nextvidpath);
                                
                                if(pc.bookmarks.length > 0) {
                                    const bm = pc.bookmarks[Math.floor(Math.random() * pc.bookmarks.length)];
                                    setplaytime = false;
                                    player.addEventListener('playing', () => {
                                        if(player.duration) {
                                            player.currentTime = Math.min(bm.time, player.duration - 0.5);
                                        } else {
                                            player.addEventListener('loadedmetadata', () => {
                                                player.currentTime = Math.min(bm.time, player.duration - 0.5);
                                            }, { once: true });
                                        }
                                        pc.updateProgressPanel();
                                        pc.setLabelText(`bookmark - ${bm.name} (${pc.formatTime(bm.time)})`);
                                    }, { once: true });
                                } else {
                                    setplaytime = true;
                                }
                                
                                console.log(`next video - ${nextvidpath}`);

                                pc.setLabelText(`${currentfilename}`);
                                
                            }
                        }
                    break;


                    case ']':
                    case 'PageDown':
                        {
                            let currentfileidx = dirlist.findIndex((a)=> {return a['d']==currentfilename});

                            if(currentfileidx != -1)
                            {
                                currentfileidx++;
                                
                                if(currentfileidx >= dirlist.length) currentfileidx = 0;
                                const nextvidpath = currentdir + '/' + dirlist[currentfileidx]['d'];
                                currentfilename = dirlist[currentfileidx]['d'];

                                player.src = nextvidpath; 
                                pc.loadBookmarksFor(nextvidpath);
                                console.log(`next video - ${nextvidpath}`);

                                pc.setLabelText(`Index ${currentfileidx+1}/${dirlist.length} - ${currentfilename}`);
                            }
                        }

                    break;

                    case '[':
                    case 'PageUp':
                        {
                            let currentfileidx = dirlist.findIndex((a)=> {return a['d']==currentfilename});

                            if(currentfileidx != -1)
                            {
                                currentfileidx--;
                                
                                if(currentfileidx < 0) currentfileidx = dirlist.length-1;
                                const nextvidpath = currentdir + '/' + dirlist[currentfileidx]['d'];
                                currentfilename = dirlist[currentfileidx]['d'];

                                player.src = nextvidpath; 
                                pc.loadBookmarksFor(nextvidpath);
                                console.log(`prev video - ${nextvidpath}`);

                                pc.setLabelText(`Index ${currentfileidx+1}/${dirlist.length} - ${currentfilename}`);
                            }
                        }
                    break;


                    case '0': 
                    case '1': 
                    case '2': 
                    case '3': 
                    case '4': 
                    case '5': 
                    case '6': 
                    case '7': 
                    case '8': 
                    case '9': 
                        pc.numberpadseeking(Number(param.key));
                    break;

                    case '.':

                            ToggleFullZoomPanning();

                        break;
                    case ' ':
                        pc.pauseplay();
                        break;
                    case 'Enter':
                    case 'f':
                        {
                            if (!document.fullscreenElement) {
                                document.documentElement.requestFullscreen();
                                ExitZoomPanning();
                            }
                            else {
                                if (document.exitFullscreen)
                                    document.exitFullscreen()
                            }
                        }
                        break;
                    case "ArrowUp":
                        pc.volumncontrol(true);
                        break;
                    case "ArrowDown":
                        pc.volumncontrol(false);
                        break;
                    case "ArrowRight":
                        {
                            let move;
                            let moveunit;
                            
                            if(param.shiftKey)
                                moveunit = 3.0;
                            else if(param.ctrlKey || param.metaKey)
                                moveunit = 1.0;
                            else
                                moveunit = 10.0;

                            move = player.currentTime + moveunit;
                            if(move >= player.duration) move = player.duration - 1.0;
                            player.currentTime = move;

                            const progress = (player.currentTime / player.duration * 100).toFixed(2);

                            pc.setLabelText(`+ ${moveunit}s (${progress}%)`);
                        }
                        break;
                    case "ArrowLeft":
                        {
                            let move;
                            let moveunit;
                            
                            if(param.shiftKey)
                                moveunit = 3.0;
                            else if(param.ctrlKey || param.metaKey)
                                moveunit = 1.0;
                            else
                                moveunit = 10.0;

                            move = player.currentTime - moveunit;
                            if(move < 0) move = 0;
                            player.currentTime = move;   

                            const progress = (player.currentTime / player.duration * 100).toFixed(2);

                            pc.setLabelText(`- ${moveunit}s (${progress}%)`);
                        }
                        break;

                    case ';':
                    case 'x':
                        {
                            if(!player.duration || !pc.currentVideoPath) break;
                            const t = player.currentTime;
                            pc.bookmarkAdd(pc.currentVideoPath, t, pc.formatTime(t));
                            pc.setLabelText(`bookmark saved - ${pc.formatTime(t)}`);
                        }
                        break;

                    case '\'':
                    case 'c':
                        {
                            if(pc.bookmarks.length == 0) { pc.setLabelText('no bookmarks'); break; }
                            const ct = player.currentTime;
                            let next = pc.bookmarks.find(b => b.time > ct + 0.5);
                            if(next == undefined) next = pc.bookmarks[0];
                            pc.seekToBookmark(next);
                        }
                        break;

                    case 'l':
                    case 'z':
                        {
                            if(pc.bookmarks.length == 0) { pc.setLabelText('no bookmarks'); break; }
                            const ct = player.currentTime;
                            let prev;
                            for(let i=pc.bookmarks.length-1;i>=0;i--) {
                                if(pc.bookmarks[i].time < ct - 0.5) { prev = pc.bookmarks[i]; break; }
                            }
                            if(prev == undefined) prev = pc.bookmarks[pc.bookmarks.length-1];
                            pc.seekToBookmark(prev);
                        }
                        break;
                }
            }

            let leftmouse_movestarted = false;
            let leftmousedowned = false;
            let leftmousedownpos = 0;

            let rightmouse_movestarted = false;
            let rightmousedowned = false;
            let rightmousedownpos = 0;

            let positionscrollstart;
            let positionscrollcurr;
            let startvideoposition;

            let intervallyspeedinfodisplay = undefined;
            let mouselongpressedcheckTimer = null;

            document.addEventListener('contextmenu', (e) => {
                const targetElement = document.elementFromPoint(e.clientX, e.clientY);
                if(!(targetElement && targetElement.id === 'progress-link')) {
                    e.preventDefault();
                }
            });

            function mouseLClickLongPressed() {
                mouselongpressedcheckTimer = null;
                console.log("long pressed !");
            }
            
            function mouseLClickShortPressed() {
                if(zoomPanningStayed) {
                    zoomPanningStayed = false;
                    console.log(`zoomPanningStayed exit`);
                    ExitZoomPanning();
                }

            }

            let videozoompanning_dragging = false;

            document.addEventListener("mousedown", (param) => {

                switch(param.button) {
                    case 0: // left
                        {
                            const targetElement = document.elementFromPoint(param.clientX, param.clientY);
                            if(targetElement && (targetElement.id === 'progress-panel' || 
                                targetElement.closest('#progress-panel') ||
                                targetElement.id === 'bookmark-panel' ||
                                targetElement.closest('#bookmark-panel'))) {
                                break;
                            }
                            mouselongpressedcheckTimer = setTimeout(mouseLClickLongPressed, 200);

                            if(zoomPanningStayed) {
                                videozoompanning_dragging = true;
                                zoomPanning_start(param.x, param.y);
                                player.style.cursor = 'none';
                            }
                            else {
                                leftmousedowned = true;
                                leftmouse_movestarted = true;
                                leftmousedownpos = param.x;
                                seeking_labelsetting_handler = setInterval(seeking_labelsetting_handler_elapsed, 100);
                            }
                            
                            break;
                        }
                    case 1: // middle
                        player.playbackRate = 1.0;
                        pc.setLabelText(`playbackrate - ${player.playbackRate.toFixed(2)}`);
                        break;
                    
                    case 2: // right
                        rightmousedowned = true;
                        rightmouse_movestarted = true;
                        rightmousedownpos = param.x;
                        break;
                }
                
            });
            
            document.addEventListener("mouseup", (param) => {
                
                switch(param.button) {
                    case 0: // left
                        {
                        
                            videozoompanning_dragging = false;
                            player.style.cursor = '';

                            if(zoomPanningStayed) {
                            }
                            else {
                                if(leftmousedowned) {
                                    leftmousedowned = false;
                                    clearInterval(seeking_labelsetting_handler);
                                    pc.hideProgressPanel();

                                    console.log(`${leftmousedownpos}, ${param.x}`);

                                    if(leftmousedownpos == param.x) {
                                        pc.pauseplay();
                                    }
                                    else {
                                        pc.player_paused_state = false;
                                        player.play();
                                        pc.setLabelText("play");
                                    }
                                    
                                }
                            }

                            if(mouselongpressedcheckTimer != null) { // cancel longpressed timeout 
                                clearInterval(mouselongpressedcheckTimer);
                                mouseLClickShortPressed();
                            }
                            
                        }
                        break;
                    
                    case 1: // middle

                        break;
                    
                    case 2: // right
                        {
                            rightmousedowned = false;
                            player.playbackRate = speed_currentpushstarts - speed_currentpush;

                            if(intervallyspeedinfodisplay != undefined)
                            {
                                clearInterval(intervallyspeedinfodisplay);
                                intervallyspeedinfodisplay = undefined;
                                console.log("intervallyspeedinfodisplay terminated");
                                
                                pc.setLabelText(`playbackrate - ${player.playbackRate.toFixed(2)}`);
                            }
                        }
                        break;
                }

            });


            let seeking_labelsetting_handler = null;
            function seeking_labelsetting_handler_elapsed() {
                let msg;

                if(!player_seeking_available)
                {
                    const progress = ((startvideoposition+positionscrollcurr) / player.duration * 100).toFixed(2);
                    const sec = parseInt(positionscrollcurr);
                    msg = `seeking to ${progress}% (${sec}s)`;
                    pc.setLabelText(msg);
                }
            }
            
            let player_seeking_available = false;
            player.addEventListener('seeked', () => {
                pc.updateProgressPanel();
                if(leftmousedowned) {

                    const progress = (player.currentTime / player.duration * 100).toFixed(2);
                    const sec = parseInt(player.currentTime - startvideoposition);
                    msg = `moved - ${progress}% (${sec}s)`;
                    pc.setLabelText(msg);

                    player_seeking();
                    player_seeking_available = true;
                }
            });

            function player_seeking() {
                player.currentTime = (startvideoposition+positionscrollcurr);
            }

            const min_seeking_unit = 0.1;
            const scroll_range = 1000;

            let speed_currentpushstarts=-1;
            let speed_currentpush;

            document.addEventListener("mousemove", (param) => {
                
                if(mouselongpressedcheckTimer != null) {
                    clearTimeout(mouselongpressedcheckTimer);
                    mouselongpressedcheckTimer = null;
                }

                if(videozoompanning_dragging) {
                    zoomPanning_move(param.clientX, param.clientY);
                }

                if(leftmousedowned) {
                    pc.showProgressPanel(true);

                    let diff = param.x - leftmousedownpos;
                    if(diff > scroll_range) diff = scroll_range;
                    diff = parseInt(diff);
                    const maxpushduration = 300.0 // second
                    let positionscroll = parseInt(diff / scroll_range * maxpushduration);

                    positionscroll /= min_seeking_unit;
                    positionscroll = parseInt(positionscroll);
                    positionscroll *= min_seeking_unit;
                    positionscroll = parseInt(positionscroll);

                    if(leftmouse_movestarted)
                    {
                        leftmouse_movestarted = false;

                        positionscrollstart = positionscroll;
                        startvideoposition = player.currentTime;

                        player_seeking_available = true;
                    }

                    positionscrollcurr = positionscroll - positionscrollstart;
                    positionscrollcurr /= 10;
                    positionscrollcurr *= 10;

                    if(player_seeking_available) {
                        player_seeking();
                        player_seeking_available = false;
                    }

                }
                else if(rightmousedowned) {

                    let diff = rightmousedownpos - param.x;
                    if(diff > scroll_range) diff = scroll_range;
                    diff = parseInt(diff);
                    const maxpushamount = 1.0;
                    
                    if(rightmouse_movestarted)
                    {
                        rightmouse_movestarted = false;
                        speed_currentpushstarts = player.playbackRate;
                        
                        if(intervallyspeedinfodisplay != undefined)
                        {
                            clearInterval(intervallyspeedinfodisplay);
                            intervallyspeedinfodisplay = undefined;
                        }

                        console.log("intervallyspeedinfodisplay started");
                        intervallyspeedinfodisplay = setInterval(() => {
                            player.playbackRate = speed_currentpushstarts - speed_currentpush;
                            pc.setLabelText(`playbackrate - ${(speed_currentpushstarts - speed_currentpush).toFixed(2)}`);
                        }, 200);
                    }

                    speed_currentpush = diff / scroll_range * maxpushamount;

                }
                else {

                    if(videozoompanning_dragging)
                    {
                        pc.hideProgressPanel();   
                    }
                    else
                    {
                        pc.showProgressPanel();
                    }
                }

            });


            async function startup() {
                
                const { parampath: _parampath, paramfind: _paramfind, paramtime: _paramtime } = pc.parseUrlParams();
                let parampath = _parampath;
                let paramfind = _paramfind;
                let paramtime = _paramtime;

                console.log(`parampath: ${parampath}`);
                console.log(`paramfind: ${paramfind}`);
                console.log(`paramtime: ${paramtime}`);

                document.title = parampath ? parampath.substring(parampath.lastIndexOf('/') + 1) : 'Video Player';

                if(parampath != null)
                {
                    // determine if parameter is a directory or file
                    let isDir = !parampath.toLowerCase().endsWith('.mp4');
                    if(isDir)
                    {
                        currentdir = parampath;
                        if(currentdir.endsWith('/')) currentdir = currentdir.slice(0, -1);
                    }
                    else
                    {
                        currentdir = parampath.substr(0, parampath.lastIndexOf('/'));
                        currentfilename = parampath.substr(parampath.lastIndexOf('/')+1);
                    }

                    const jsondata = await pc.dirseek(currentdir);
                    
                    if(jsondata["ret"])
                    {
                        dirlist = jsondata["data"];
                        
                        // remove hidden files
                        while(true) {  
                            const find__ = dirlist.find((a) => { return a["d"][0] == '.';});
                            if(find__ == undefined) break;
                            const idx = dirlist.lastIndexOf(find__);
                            dirlist.splice(idx, 1);
                        }

                        // keep only mp4s
                        while(true) {  
                            const find__ = dirlist.find((a) => { return a["d"].substr(a["d"].lastIndexOf('.')) != ".mp4" });
                            if(find__ == undefined) break;
                            const idx = dirlist.lastIndexOf(find__);
                            dirlist.splice(idx, 1);
                        }
                    }
                    
                    for(let i=0;i<dirlist.length;i++)
                    {
                        dirlist[i]["t"] = Date.parse(dirlist[i]["t"]);
                    }
                    
                    dirlist.sort((a,b) => { return b["t"] - a["t"]; });

                    if(paramfind != null)
                    {
                        console.log(`filtering by ${paramfind}`);   
                        dirlist = dirlist.filter(e => e["d"].toUpperCase().includes(paramfind.toUpperCase()));
                    }

                    dirlist = dirlist.filter(e => !e["d"].toLowerCase().includes('tmw'));

                    console.log(dirlist);

                    // if caller passed a directory and it's empty, abort
                    if(isDir && dirlist.length === 0) {
                        console.log('no mp4 files in directory');
                        return;
                    }

                    // if caller passed a directory, pick a random file now
                    if(isDir && dirlist.length > 0)
                    {
                        const randomitem = dirlist[Math.floor(Math.random() * dirlist.length)];
                        currentfilename = randomitem['d'];
                        parampath = currentdir + '/' + currentfilename;
                        setplaytime = true;
                        console.log(`random selected - ${currentfilename}`);
                    }

                    // If caller passed a file directly with bookmark time (t), seek to it
                    if(!isDir && paramtime != null) {
                        setplaytime = true;
                    }

                    player.src = parampath;
                    pc.loadBookmarksFor(parampath);
                    player.addEventListener("playing", () => {
                        if(setplaytime)
                        {
                            setplaytime = false;
                            let seekto;
                            if(paramtime != null && player.duration) {
                                seekto = Math.min(paramtime, player.duration - 1);
                            }
                            else {
                                const duration_block = player.duration / 10;
                                seekto = duration_block + (duration_block * (Math.random()*3.0));
                            }
                            player.currentTime = seekto;
                            console.log(player.currentTime);
                            
                            const progress = (player.currentTime / player.duration * 100).toFixed(2);
                            const sec = parseInt(player.currentTime);
                            msg = `moved - ${progress}% (${sec}s)`;
                            pc.setLabelText(msg);
                            paramtime = null;
                            
                        }
                        pc.updateProgressPanel();
                    });
                    player.addEventListener("loadedmetadata", () => {
                        console.log(`metadata loaded - ${player.videoWidth}x${player.videoHeight}`);
                        console.log(`win : ${window.innerWidth}x${window.innerHeight}`);
                        
                        if(zoomPanningStayed) {
                            FullZoomPanning();
                        }
                        else {
                            ExitZoomPanning();
                        }
                        
                        pc.updateProgressPanel();
                        pc.showProgressPanel();
                        pc.renderBookmarkMarkers();
                    });

                    pc.video_filter_set();

                    player.volume = 0.2;
                    
                    pc.setLabelText(currentfilename);

                    window.addEventListener("keydown", onKeydown);
                }
                else
                {
                    console.log(`${parampath} is null`);
                }
            }

            startup();

        </script>

    </body>
</html>
